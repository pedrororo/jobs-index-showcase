# No secrets here: everything Databricks needs comes from the environment.
remote_jobs:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', env_var('LAKE_ROOT', 'lakehouse') ~ '/lakehouse.duckdb') }}"
      threads: 4
    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      catalog: "{{ env_var('DBT_DATABRICKS_CATALOG', 'workspace') }}"
      schema: "{{ env_var('DBT_DATABRICKS_SCHEMA', 'remote_jobs') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      threads: 4
